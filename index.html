const COL={DFL:'#2166cc',R:'#d1342b'};function col(p){return COL[p]||'#828282';}
function base(p){return p==='DFL'?[33,102,204]:p==='R'?[209,52,43]:[130,130,130];}
const fmt=n=>n.toLocaleString();
// totals
const seats={DFL:0,R:0,Other:0,Undecided:0},votes={};let rep=0,tot=0,allv=0;
for(let d=1;d<=67;d++){const r=DATA[d];if(!r||!r.leader){seats.Undecided++;}else{const p=r.leader.party;seats[p==='DFL'||p==='R'?p:'Other']++;}
 if(r){rep+=r.rep;tot+=r.tot;r.cands.forEach(c=>{const p=c.party==='DFL'||c.party==='R'?c.party:'Other';votes[p]=(votes[p]||0)+c.votes;allv+=c.votes;});}}
const pr=tot?(100*rep/tot).toFixed(1):'0.0';
document.getElementById('cards').innerHTML=
 [['DFL leading/won',seats.DFL,COL.DFL],['R leading/won',seats.R,COL.R],['Other',seats.Other,'#828282'],['Undecided / no votes',seats.Undecided,'#999'],
  ['Precincts reporting',`${fmt(rep)} of ${fmt(tot)}<div class=c>${pr}%</div>`,'#222']]
 .map(([k,v,c])=>`<div class=card><div class=c>${k}</div><div class=n style="color:${c}">${v}</div></div>`).join('');
document.getElementById('bar').innerHTML=`<div style="width:${seats.DFL/67*100}%;background:${COL.DFL}"></div><div style="width:${seats.Other/67*100}%;background:#828282"></div><div style="width:${seats.Undecided/67*100}%;background:#ddd"></div><div style="width:${seats.R/67*100}%;background:${COL.R}"></div><span class=maj></span>`;
document.getElementById('votes').innerHTML='<div class=card style="flex-basis:100%"><div class=c><b>Statewide Senate votes by party</b> (total '+fmt(allv)+')</div>'+
 ['DFL','R','Other'].map(p=>`<span style="margin-right:16px;color:${col(p)}"><b>${p}</b> ${fmt(votes[p]||0)} (${allv?(100*(votes[p]||0)/allv).toFixed(1):'0.0'}%)</span>`).join('')+'</div>';
function style(f){const r=DATA[+f.properties.DISTRICT];let c='#ddd',o=0.5;
 if(r&&r.leader){const b=base(r.leader.party);const t=Math.min(1,0.25+(r.margin||0)/40);
  c=`rgb(${Math.round(255-(255-b[0])*t)},${Math.round(255-(255-b[1])*t)},${Math.round(255-(255-b[2])*t)})`;o=0.85;}
 return {color:'#333',weight:1,fillColor:c,fillOpacity:o};}
function pop(d){const r=DATA[d];if(!r)return `<b>SD ${d}</b><br>No race in results file`;
 let h=`<b>Senate District ${d}</b><br>${r.rep}/${r.tot} precincts reporting (${r.pct_rep}%)<table>`;
 r.cands.forEach(c=>h+=`<tr><td><i class=sw style="background:${col(c.party)}"></i>${c.name}${c.inc?' (i)':''}</td><td>${c.party}</td><td class=num>${fmt(c.votes)}</td><td class=num>${c.pct.toFixed(2)}%</td></tr>`);
 return h+`</table>`+(r.margin!=null?`Leader: <b>${r.leader.name}</b> (${r.leader.party}) by ${r.margin.toFixed(2)} pts`:'<i>No votes reported yet</i>');}
const map=L.map('map').setView([46.3,-94.3],6);
L.tileLayer('https://{s}.basemap.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OSM, CARTO; districts LCC-GIS; results MN SOS'}).addTo(map);
const LAY={};
L.geoJSON(GEO,{style,onEachFeature:(f,l)=>{const d=+f.properties.DISTRICT;LAY[d]=l;l.bindPopup(pop(d),{maxWidth:320});l.bindTooltip('SD '+d);}}).addTo(map);
// table
let sk='d',sd=1;
function rows(){const q=document.getElementById('q').value.toLowerCase().trim();const out=[];
 for(let d=1;d<=67;d++){const r=DATA[d];const txt=('sd '+d+' '+(r?r.cands.map(c=>c.name+' '+c.party).join(' '):'')).toLowerCase();
  if(q&&!(String(d)===q||txt.includes(q)))continue;out.push({d,r,l:r&&r.leader?r.leader.name:'',m:r&&r.margin!=null?r.margin:-1,p:r?r.pct_rep:0});}
 out.sort((a,b)=>(a[sk]>b[sk]?1:a[sk]<b[sk]?-1:0)*sd);
 document.getElementById('tb').innerHTML=out.map(({d,r})=>{if(!r)return `<tr class=row data-d=${d}><td>${d}</td><td colspan=3>No race in file</td></tr>`;
  const ld=r.leader;const cands=r.cands.map(c=>`<div class=c><i class=sw style="background:${col(c.party)}"></i>${c.name}${c.inc?' (i)':''} · ${c.party} · ${fmt(c.votes)} · ${c.pct.toFixed(2)}%</div>`).join('');
  return `<tr class=row data-d=${d}><td><b>${d}</b></td><td>${ld?`<b style="color:${col(ld.party)}">${ld.name} (${ld.party})</b>`:'<i>No votes yet</i>'}${cands}</td><td class=num>${r.margin!=null?r.margin.toFixed(2)+' pts':'–'}</td><td class=num>${r.rep}/${r.tot}<div class=c>${r.pct_rep}%</div></td></tr>`;}).join('');}
document.getElementById('q').oninput=rows;
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;sd=(sk===k)?-sd:1;sk=k;rows();});
document.getElementById('tb').onclick=e=>{const tr=e.target.closest('tr.row');if(!tr)return;const l=LAY[+tr.dataset.d];if(!l)return;
 map.fitBounds(l.getBounds(),{maxZoom:11});l.openPopup();if(innerWidth<=800)document.getElementById('map').scrollIntoView({behavior:'smooth'});};
rows();
function sz(){document.documentElement.style.setProperty('--h',document.getElementById('hdr').offsetHeight+'px');map.invalidateSize();}
addEventListener('resize',sz);sz();
